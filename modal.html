<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morphing Terminal Modal</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      font-family: monospace;
      height: 100vh;
      display: flex;
      color: #00ff88;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background: #1a1a1a;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .morph-btn {
      padding: 1rem;
      background: #00ff88;
      color: #121212;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .modal {
      position: fixed;
      background: #1e1e1e;
      border: 2px solid #00ff88;
      box-shadow: 0 0 20px #00ff88;
      padding: 1rem 2rem;
      overflow: auto;
      opacity: 0;
      transform: scale(0);
      transition: all 0.4s ease;
      z-index: 10;
    }

    .modal.show {
      opacity: 1;
      transform: scale(1);
    }

    #terminal {
      white-space: pre-wrap;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: transparent;
      border: none;
      color: #00ff88;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <button class="morph-btn" data-content="about">$ about</button>
    <button class="morph-btn" data-content="skills">$ skills</button>
    <button class="morph-btn" data-content="contact">$ contact</button>
  </div>

  <div class="modal" id="modal">
    <button class="close-btn" id="closeBtn">×</button>
    <div id="terminal"></div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.morph-btn');
    const modal = document.getElementById('modal');
    const terminal = document.getElementById('terminal');
    const closeBtn = document.getElementById('closeBtn');

    const contents = {
      about: [
        "$ whoami",
        "I'm a creative web developer who loves clean UI and weird ideas."
      ],
      skills: [
        "$ skills",
        "JavaScript, CSS, HTML, Python, and terminal aesthetics 😎"
      ],
      contact: [
        "$ contact",
        "Email: dev@example.com",
        "GitHub: @terminaldev"
      ]
    };

    let animating = false;
    let lastButton = null;

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (animating) return;
        animating = true;

        lastButton = btn;
        modal.dataset.fromBtn = btn.dataset.content;

        const rect = btn.getBoundingClientRect();

        modal.style.transition = 'none';
        modal.style.top = `${rect.top}px`;
        modal.style.left = `${rect.left}px`;
        modal.style.width = `${rect.width}px`;
        modal.style.height = `${rect.height}px`;
        modal.style.opacity = '1';
        modal.style.transform = 'scale(1)';
        modal.classList.add('show');

        setTimeout(() => {
          modal.style.transition = 'all 0.4s ease';
          modal.style.top = '50%';
          modal.style.left = '50%';
          modal.style.width = '600px';
          modal.style.height = '300px';
          modal.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 10);

        setTimeout(() => {
          terminal.textContent = '';
          const contentKey = btn.dataset.content;
          const lines = contents[contentKey] || ["$ unknown", "No data"];
          typeLines(lines);
          animating = false;
        }, 500);
      });
    });

    function typeLine(line, callback) {
      let i = 0;
      const interval = setInterval(() => {
        terminal.textContent += line.charAt(i);
        i++;
        if (i >= line.length) {
          clearInterval(interval);
          terminal.textContent += "\n";
          setTimeout(callback, 200);
        }
      }, 25);
    }

    function typeLines(lines) {
      let current = 0;
      function next() {
        if (current < lines.length) {
          typeLine(lines[current], () => {
            current++;
            next();
          });
        }
      }
      next();
    }

    closeBtn.addEventListener('click', () => {
      if (animating || !lastButton) return;
      animating = true;

      const rect = lastButton.getBoundingClientRect();

      modal.style.transition = 'all 0.4s ease';
      modal.style.transform = 'scale(1)';
      modal.style.top = `${rect.top}px`;
      modal.style.left = `${rect.left}px`;
      modal.style.width = `${rect.width}px`;
      modal.style.height = `${rect.height}px`;

      setTimeout(() => {
        modal.classList.remove('show');
        modal.style.opacity = '0';
        terminal.textContent = '';
        animating = false;
      }, 400);
    });
  </script>

</body>
</html>
